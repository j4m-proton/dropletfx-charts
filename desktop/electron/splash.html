<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: radial-gradient(120% 90% at 50% 0%, #1a0406 0%, #0b0b0f 55%, #000 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag; user-select: none;
        box-sizing: border-box; border: 1px solid rgba(245, 5, 18, 0.18);
      }
      .glow {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(50% 40% at 50% 40%, rgba(245, 5, 18, 0.16), transparent 70%),
          radial-gradient(60% 45% at 50% 100%, rgba(194, 0, 14, 0.20), transparent 70%);
      }
      img {
        width: 34vmin; max-width: 420px; min-width: 260px; height: auto; z-index: 1;
        filter: drop-shadow(0 14px 60px rgba(245, 5, 18, 0.35));
      }
      .bar {
        z-index: 1; margin-top: 40px; width: 240px; height: 5px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.08); overflow: hidden;
      }
      .bar i {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #f50512, #c2000e);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); } 100% { transform: translateX(320%); }
      }
      .tag {
        z-index: 1; margin-top: 18px; font-size: 12px; letter-spacing: 4px;
        text-transform: uppercase; color: rgba(255, 255, 255, 0.45);
      }
      /* Startup failures are written here rather than leaving a blank screen. */
      .err {
        z-index: 2; margin-top: 22px; max-width: 620px; padding: 0 24px;
        font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.6;
        color: #ff6b6b; text-align: center; white-space: pre-wrap; display: none;
      }
      body[data-error] .err { display: block; }
      body[data-error] .err::before { content: attr(data-msg); }
      body[data-error] .bar { display: none; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <!-- Lives under build/ so it is packed inside the asar alongside this
         file; ../../brand would resolve outside the archive once packaged. -->
    <img src="../build/splash-logo.svg" alt="DropletFX" />
    <div class="bar"><i></i></div>
    <div class="tag">starting charts</div>
    <div class="err"></div>
    <script>
      // main.cjs sets data-error on <body> when startup fails.
      new MutationObserver(() => {
        const msg = document.body.getAttribute('data-error');
        if (msg) {
          document.querySelector('.err').textContent = msg;
          document.querySelector('.tag').textContent = 'could not start';
        }
      }).observe(document.body, { attributes: true, attributeFilter: ['data-error'] });
    </script>
  </body>
</html>
